<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Maychembaclieu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.15);
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00ffcc, #0077ff);
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            color: #0f0f1a;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        p.bio {
            color: #a0a0b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #00ffcc;
            color: #0f0f1a;
            box-shadow: 0 0 15px #00ffcc;
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">卍</div>
        <h1>Maychembaclieu</h1>
        <p class="bio">Chào mừng đến với trang web đầu tiên của tôi 🚀</p>
        
        <div class="links">
            <a href="#" class="btn">Discord Server</a>
            <a href="#" class="btn">TikTok</a>
            <a href="#" class="btn">Facebook</a>
        </div>

        <div class="footer">© 2026 - Hosted on GitHub Pages</div>
    </div>

</body>
</html>
